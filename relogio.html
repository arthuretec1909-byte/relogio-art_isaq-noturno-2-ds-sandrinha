<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relogio funcional</title>
    <link rel="stylesheet" href="relogio.css">
    <script src="relogio.js"></script>
</head>
    <body>
        <h1>Obj Date(), funções setInterval(), clearInterval()</h1> <br>
        <div class="fundo">
        <form>
            
            Data Atual: <input type="text" class="men" id="dia" readonly>/
            <input type="text" class="men" id="mes" readonly>/
            <input type="text" class="men" id="anos" readonly><br><br>
            Nome do mês: <input type="text" id="nome_mes" readonly><br>
            Hora atual: <input type="text" class="men" id="hora" readonly> / 
            <input type="text" class="men" id="minu" readonly> / 
            <input type="text" class="men" id="segu" readonly><br>
            Dia da Semana: <input type="text" id="sem" readonly><br>
            <input type="button" onclick="exibir()" value="Exibir">
            <input type="button" onclick="parar()" value="Parar">
            <input type="reset" value="Limpar" onclick="parar()">
        </form>
        </div>
    </body>
    </div>
</html>
